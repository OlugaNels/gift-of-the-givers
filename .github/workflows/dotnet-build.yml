name: .NET build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore GiftOfTheGivers.Website.sln
      - name: Build
        run: dotnet build GiftOfTheGivers.Website.sln --configuration Release --no-restore
